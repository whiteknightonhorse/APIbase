# APIbase sandbox (T-INT-26, spec F-17) — second compose project on the same server.
# Same image as production, its own postgres/redis, testnet rails, no overlap with the prod stack.
#
# Operator/dispatcher only; nothing here is started by a task:
#   cd deploy/sandbox && cp sandbox.env.example .env.sandbox   # then fill in the blanks
#   docker compose -p apibase-sandbox -f docker-compose.sandbox.yml --env-file .env.sandbox up -d
#
# Isolation vs docker-compose.yml:
#   project name  apibase-sandbox (prod: directory default)
#   network       sandbox_net      (separate bridge)
#   volumes       sandbox_pg, sandbox_redis (prod: postgres_data, redis_data)
#   host port     127.0.0.1:8881   (prod: 127.0.0.1:8880)
# Cost: six base containers of memory and disk; limits below are deliberately smaller than prod.
name: apibase-sandbox

services:
  postgres:
    image: postgres:16.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apibase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-apibase}
    volumes:
      - sandbox_pg:/var/lib/postgresql/data
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apibase}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sandbox_redis:/data
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  api:
    image: ghcr.io/whiteknightonhorse/apibase:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["node", "dist/api/server.js"]
    env_file:
      - .env.sandbox
    environment:
      - SERVICE_NAME=api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    stop_grace_period: 20s

  worker:
    image: ghcr.io/whiteknightonhorse/apibase:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["node", "dist/worker/server.js"]
    env_file:
      - .env.sandbox
    environment:
      - SERVICE_NAME=worker
      - DATABASE_URL=${DATABASE_URL_WORKER}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/worker/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    stop_grace_period: 60s

  outbox-worker:
    image: ghcr.io/whiteknightonhorse/apibase:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["node", "dist/outbox/server.js"]
    env_file:
      - .env.sandbox
    environment:
      - SERVICE_NAME=outbox
      - DATABASE_URL=${DATABASE_URL_OUTBOX}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3002/outbox/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    stop_grace_period: 30s

  # Container nginx: the same config and static tree as prod, published on a different host port.
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8881:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../static-current:/var/www/static:ro
      - /home/apibase/content-hub/guides:/var/www/guides:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/stub_status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  sandbox_pg:
  sandbox_redis:

networks:
  sandbox_net:
    driver: bridge
