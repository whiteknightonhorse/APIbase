version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: ci-staging
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/mcp-client"
      - "/packages/merchant-renewer"
      - "/packages/stream-settler"
    target-branch: ci-staging
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 3
    versioning-strategy: increase
    ignore:
      # tsx 4.22.5 and 4.23.x break tests/unit/mppx-redis-store.test.ts; held at 4.21.0.
      # Remove when a tsx release passes that test (T-0518, T-0519).
      - dependency-name: "tsx"
        versions: [">=4.22.0"]
      # zod is 4.6.x since T-0603; a zod major (5) goes through a card (T-0704, 2026-11-10).
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # prisma 7 is a migration, not a bump; checks fail on #394 (T-0519).
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # node-cron 4 is a major on the worker scheduler; node-cron is jest.mock'ed in both worker tests,
      # so CI never exercises it, and every money job (refund payout, stream settle) runs on it.
      # Stay on 3.0.3 until a security advisory or a Node engine change forces the move (T-0703, 2026-11-04).
      - dependency-name: "node-cron"
        update-types: ["version-update:semver-major"]
      # mppx 0.x minors are breaking on the MPP payment rail (0.16 attestation->identity, 0.17 identity nonce);
      # they go through a money card (T-0566, T-0704). Patches still flow (T-0703, 2026-11-04).
      - dependency-name: "mppx"
        update-types: ["version-update:semver-minor"]
      # jsdom >= 30 requires Node >= 22 (engines); CI (test.yml:62) and the image (Dockerfile:1) are on Node 20.
      # Dev-only, one consumer: tests/unit/dashboard-m-fields.test.ts. Remove with the Node >= 22 image card (T-0749, 2026-11-10).
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
