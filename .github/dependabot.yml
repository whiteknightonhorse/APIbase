version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: ci-staging
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/mcp-client"
      - "/packages/merchant-renewer"
      - "/packages/stream-settler"
    target-branch: ci-staging
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
