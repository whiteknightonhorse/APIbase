version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: ci-staging
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/mcp-client"
      - "/packages/merchant-renewer"
      - "/packages/stream-settler"
    target-branch: ci-staging
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 3
    versioning-strategy: increase
    ignore:
      # tsx 4.23.x breaks tests/unit/mppx-redis-store.test.ts; held at 4.21.0 (T-0518)
      - dependency-name: "tsx"
        versions: [">=4.23.0"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
