# APIbase.pro — PR Validation (§12.12)
# Runs on pull requests to main: lint, typecheck, unit + DB tests (disposable Postgres, T-0597).

name: Test

on:
  pull_request:
    branches: [main, ci-staging]

permissions:
  contents: read

jobs:
  validate:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable Postgres for the dbDescribe suites (major matches docker-compose.yml).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apibase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d apibase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # shop-stream-merchant-real-mppx opens a real ioredis connection (TEST_REDIS_URL).
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/apibase_test
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: nginx -t (nginx/nginx.conf in nginx:1.25-alpine)
        run: bash scripts/check-nginx-conf.sh

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + DB tests
        # F8: --passWithNoTests removed: a broken jest config that collects 0 tests should FAIL the
        # build. The jest reporter prints "DB suites skipped: N" and fails the run when N > 0
        # (T-0597). Schema migrations run once per process from tests/unit/helpers/shop-db.ts.
        run: npm run test -- --ci --maxWorkers=2
