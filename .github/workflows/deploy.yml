# APIbase.pro — CI/CD Deploy Pipeline (§12.12, §12.222)
#
# Pipeline: lint → typecheck → test → Docker build → push GHCR → SSH deploy → smoke test
# Deploy strategy (Phase 1): 5-10s downtime acceptable.
# Rollback: automatic on smoke test failure via scripts/deploy.sh.
#
# Required GitHub Secrets:
#   SSH_KEY          — Private key for SSH to Hetzner server
#   SERVER_HOST      — Hetzner server IP address
#   DEPLOY_USER      — SSH username (not root)

name: Deploy

on:
  push:
    # ci-staging: required-status-check gate for branch-protected main (A-05).
    # push skill lands a commit here first so "Build & Push Image" reports
    # success for that SHA *before* GitHub allows it to land on main.
    branches: [main, ci-staging]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/whiteknightonhorse/apibase
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # -------------------------------------------------------------------------
  # Stage 1: Validate (lint + typecheck + test)
  # -------------------------------------------------------------------------
  validate:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # F8: --passWithNoTests removed -- same reasoning as test.yml. This is the
        # job that gates promotion to main; a config that silently collects 0 tests
        # must never report green right before a deploy.
        run: npm run test -- --ci

  # -------------------------------------------------------------------------
  # Stage 2: Build Docker image + push to GHCR
  # -------------------------------------------------------------------------
  build:
    name: Build & Push Image
    needs: validate
    runs-on: ubuntu-latest
    # T-74 (2026-09-04): the image itself (docker/build-push-action) finished and pushed
    # to GHCR in ~14min on run 33861174289 -- the job was then killed by this timeout while
    # stuck on `cache-to: type=gha,mode=max`'s "exporting to GitHub Actions Cache" step (one
    # layer write never completed, a known GHA cache-backend flake, not a code/build defect).
    # 15 -> 25 gives that export step headroom without touching the (working) build itself.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Stage 3: Deploy to Hetzner via SSH
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /home/apibase/apibase && bash scripts/deploy.sh ${{ github.sha }}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
