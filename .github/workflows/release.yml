name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check tag against package.json and release notes
        run: bash scripts/release-check.sh "$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
      - name: Build and attach the WooCommerce plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/woo/build-zip.sh "$PWD/dist/woocommerce-apibase.zip"
          gh release upload "$GITHUB_REF_NAME" dist/woocommerce-apibase.zip --clobber
