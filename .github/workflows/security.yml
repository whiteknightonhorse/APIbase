name: Security Audit

on:
  push:
    # F3: also run on ci-staging, not just main. promote_staging.sh (the only path onto
    # branch-protected main) reads these jobs' check-runs for the ci-staging SHA BEFORE
    # promoting -- if this only ran on main, that data would not exist yet at decision
    # time (promotion IS what puts the SHA on main), so the required-check gate added to
    # promote_staging.sh would see "MISSING" forever and never promote anything.
    branches: [main, ci-staging]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday 04:00 UTC

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: npm audit (production)
        run: npm audit --production --audit-level=high || true

      - name: Check for known vulnerabilities
        run: |
          echo "=== High/Critical vulnerabilities ==="
          VULNS=$(npm audit --production --json 2>/dev/null | node -e "
            const d=require('fs').readFileSync('/dev/stdin','utf8');
            try { const j=JSON.parse(d); console.log(j.metadata?.vulnerabilities?.high||0,j.metadata?.vulnerabilities?.critical||0); }
            catch { console.log('0 0'); }
          ")
          HIGH=$(echo $VULNS | cut -d' ' -f1)
          CRIT=$(echo $VULNS | cut -d' ' -f2)
          echo "High: $HIGH, Critical: $CRIT"
          if [ "$CRIT" -gt 0 ]; then
            echo "::error::Critical vulnerabilities found!"
            exit 1
          fi

  typecheck:
    name: Type Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript strict check
        run: npx tsc --noEmit --skipLibCheck

  adapter-boundary:
    name: Adapter Import Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No adapter imported outside pipeline/tests
        run: python3 scripts/check-adapter-import-boundary.py

  mount-nginx-parity:
    name: Mount-Nginx Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Every declared route has an nginx location proxying to it
        run: python3 scripts/check-mount-nginx-parity.py

  static-tool-refs:
    # F5: connect.html's starter example called `tools/coingecko.get_price/call`,
    # which does not exist -- the real id is `crypto.get_price`. Nothing compared
    # what static/*.html tells visitors to call against the real tool catalog.
    name: Static Page Tool References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Every tools/<id>/call reference in static/*.html is a real tool_id
        run: npx tsx scripts/check-static-tool-refs.ts

  static-counts-drift:
    # F9: sync-counts.sh --check was written FOR CI but wired to nothing -- zero
    # references in any workflow or cron. It needs the live production DB (docker exec
    # into postgres), so a GH-hosted runner reaches it the same way deploy.yml reaches
    # the server: over SSH. Read-only (--check writes nothing); the self-heal (no
    # --check) side lives in the daily crontab instead, not here -- a CI job should
    # report drift, not silently fix production files on every push.
    name: Static Counts Drift
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: sync-counts.sh --check against the live server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /home/apibase/apibase && bash scripts/sync-counts.sh --check"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

  dead-exports:
    # Report-only since 2026-09-01 (Fable-approved gate, F1 follow-up):
    # finalizeIdempotency() sat unused for a real request cycle before anyone
    # noticed — an exported function nothing calls is exactly the class of
    # bug this catches. One week of report-only lets the existing 36-item
    # baseline (see knip.json) get triaged without breaking unrelated PRs;
    # after 2026-09-08 this step should drop "|| true" and start failing on
    # NEW unused exports (a checked-in baseline count, or --include exports
    # with a per-item allowlist, whichever is smaller at the time).
    name: Dead Exports (knip, report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: knip — unused exports (report-only, see comment above)
        run: npx knip --include exports || true
